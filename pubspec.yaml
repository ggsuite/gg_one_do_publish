  gg_one_merge: ^2.6.0
  gg_process: ^1.2.0
  gg_publish: ^4.5.0
  gg_status_printer: ^1.6.0
  gg_version: ^5.4.0
  matcher: ^0.12.20
  mocktail: ^1.0.5
  path: ^1.9.1
