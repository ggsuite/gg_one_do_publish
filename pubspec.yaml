name: gg_one_do_publish
description: "The publish orchestrator of the gg_one tool family - version bump, changelog, registry upload, merge, tags and resume."
version: 2.5.2
repository: https://github.com/ggsuite/gg_one_do_publish.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.0.1
  gg_changelog: ^2.0.1
  gg_console_colors: ^2.3.1
  gg_direct_json: ^2.0.2
  gg_git: ^4.1.2
  gg_lang: ^0.5.1
  gg_log: ^1.0.7
  gg_merge: ^3.3.1
  gg_one_commit: ^2.2.3
  gg_one_core: ^2.4.2
  gg_one_merge: ^2.4.1
  gg_process: ^1.1.7
  gg_publish: ^4.3.3
  gg_status_printer: ^1.4.3
  gg_version: ^5.2.2
  matcher: ^0.12.20
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.0

dev_dependencies:
  gg_capture_print: ^1.0.10
  lints: ^6.1.0
  test: ^1.31.2